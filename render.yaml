services:
  - type: web
    name: villagkart-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromConfigVar: DATABASE_URL
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000

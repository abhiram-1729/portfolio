name: Backend Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            export PATH=$PATH:/home/ubuntu/n/bin

            cd /opt/apps/villagkart/vgk_sales

            git checkout develop

            git pull origin develop

            cd backend

            npm install

            npx prisma generate

            DIRECT_URL="${{ secrets.DIRECT_URL }}" DATABASE_URL="${{ secrets.DATABASE_URL }}" npx prisma db push

            pm2 restart vsms-backend

            pm2 save
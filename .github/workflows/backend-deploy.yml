name: Backend Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            export PATH=$PATH:/home/ubuntu/n/bin

            cd /opt/apps/villagkart/vsms

            git checkout develop

            git pull origin develop

            cd backend

            npm install

            npx prisma generate

            DATABASE_URL="postgresql://postgres.jehbniifcrzyuadbrron:EMqNF6k3hBZV9bMs@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres" npx prisma db push 

            pm2 restart vsms-backend

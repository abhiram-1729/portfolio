name: Backend Deploy

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            export PATH=$PATH:/home/ubuntu/n/bin

            cd /opt/apps/villagkart/vgk_sales

            git checkout develop

            git pull origin develop

            cd backend

            npm install

            npx prisma generate

            # 🛡️ Data Integrity Guard: Automatically generate a point-in-time database snapshot dump before any schema mutation occurs
            mkdir -p /opt/apps/villagkart/db_backups
            export PGPASSWORD="EMqNF6k3hBZV9bMs"
            pg_dump -h aws-1-ap-northeast-1.pooler.supabase.com -U postgres.jehbniifcrzyuadbrron -d postgres -F c -b -f /opt/apps/villagkart/db_backups/vsms_prod_$(date +%Y%m%d_%H%M%S).dump || echo "[Warning] pg_dump utility unavailable. Proceeding with deployment sync."

            # 🚀 Primary production migration execution (applies versioned SQL scripts deterministically if committed)
            DATABASE_URL="postgresql://postgres.jehbniifcrzyuadbrron:EMqNF6k3hBZV9bMs@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres" npx prisma migrate deploy

            pm2 restart vsms-backend

            pm2 save